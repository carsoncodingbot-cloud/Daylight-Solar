name: fetch-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch renders
        run: |
          mkdir -p _tmp/photos
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3EI4gPQXbCIDkEZJNju9hERMEXZ"
          curl -fsSo _tmp/photos/rooftop.png "$base/hf_20260821_084048_637fdc2a-a3a1-43e8-aba7-842d450253a6.png"
          curl -fsSo _tmp/photos/battery.png "$base/hf_20260821_084048_0ff6ee55-2472-4bde-904e-f6858cfeb1cc.png"
          curl -fsSo _tmp/photos/install.png "$base/hf_20260821_084048_4c5e2122-2130-4e48-9b48-f09c93de2e68.png"
      - name: Commit
        run: |
          git config user.name "asset-fetch"
          git config user.email "actions@github.com"
          git add _tmp
          git commit -m "temp: photo renders"
          git push
