name: fetch-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch renders
        run: |
          mkdir -p _tmp/pa
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3EI4gPQXbCIDkEZJNju9hERMEXZ"
          curl -fsSo _tmp/pa/farmhouse.png "$base/hf_20260825_022323_115feb49-755f-44c3-b164-4c8f53546778.png"
          curl -fsSo _tmp/pa/craftsman.png "$base/hf_20260825_022323_ee6abf1d-e437-4d80-a272-df509e2d9250.png"
      - name: Commit
        run: |
          git config user.name "asset-fetch"
          git config user.email "actions@github.com"
          git add _tmp
          git commit -m "temp: PA backplates"
          git push
